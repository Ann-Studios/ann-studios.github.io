<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ann Studios</title>
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        var normalized = path.replace(/&/g, "~and~");
        var target = "/?p=" + encodeURIComponent(normalized);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
